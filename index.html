<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡通图 · 人工选图</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><span class="eyebrow">QWEN / HUMAN REVIEW</span><h1>选一张更好的卡通图</h1></div><div class="tools"><button id="import">导入标注</button><input id="file" type="file" accept="application/json" hidden><button id="json">导出 JSON</button><button id="csv">导出 CSV</button></div></header>
<div class="toolbar"><label>范围 <select id="scope"><option value="redo">148张重做清单</option><option value="all">全部500张</option></select></label><label>查看 <select id="filter"><option value="all">全部</option><option value="pending">待选择</option><option value="done">已选择</option></select></label><label class="search">搜索编号 <input id="search" type="search" placeholder="round_2_008"></label><span id="progress" role="status"></span></div>
<main><nav class="navigator"><button id="prev">← 上一张</button><div><h2 id="id">正在读取图片清单</h2><span id="position"></span></div><button id="next">下一张 →</button></nav>
<div id="images" class="images"></div><div id="choices" class="choices"><button data-choice="old"><kbd>1</kbd> 原版更好</button><button data-choice="new"><kbd>2</kbd> 重跑更好</button><button data-choice="redo"><kbd>3</kbd> 都重做</button></div><div class="selection"><span id="selection"></span><label><input id="advance" type="checkbox" checked> 选完自动下一张</label></div><p id="save" role="status">选择自动保存在当前浏览器。导出文件可保存备份，并在另一台设备导入。</p><details><summary>图片来源与许可</summary><div id="credit"></div><a href="ATTRIBUTIONS.json" target="_blank" rel="noopener">完整来源与署名清单</a></details><div id="empty" hidden>这组图片已选完，可以切换范围或导出标注。</div></main>
<footer><span id="freshness"></span><span>点击图片放大 · 数字1/2/3选择 · ← / →切换</span></footer><dialog id="zoom"><form method="dialog"><button aria-label="关闭大图">关闭 ×</button></form><img id="zoomImage" alt="图片放大对照"></dialog><script src="app.js"></script></body></html>
